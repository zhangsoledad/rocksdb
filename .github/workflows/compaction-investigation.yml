name: Concurrent compaction investigation
on:
  push:
    branches: [codex/freezer-compaction-investigation]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        revision: [c3d2a1019ac01606156974dcf309bd6a31d0d538, 06829eccbaaea93632f84d82e5b4352f8edcd497]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.revision }}
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libgflags-dev libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev libbz2-dev
      - name: Capture the underlying remote compactor failure
        run: |
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          c++ --version > evidence/compiler.txt
          df -h /dev/shm > evidence/tmpfs.txt
          lscpu > evidence/cpu.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('db/compaction/compaction_service_test.cc')
          source=p.read_text()
          # Locate this exact branch inside MyTestCompactionService::Wait.
          start=source.index('    compaction_num_.fetch_add(1);')
          end=source.index('\n  CompactionServiceOptionsOverride GetOptionsOverride()', start)
          body=source[start:end]
          target='      return CompactionServiceJobStatus::kFailure;'
          assert body.count(target)==1
          body=body.replace(target, '      fprintf(stderr, "OpenAndCompact job %s: %s\\n", scheduled_job_id.c_str(), s.ToString().c_str());\n'+target)
          p.write_text(source[:start]+body+source[end:])
          PY
          git diff > evidence/diagnostic.patch
          AUTO_CLEAN=1 make -j"$(nproc)" compaction_service_test > evidence/build.log 2>&1
      - name: Repeat the original assertion without retries
        timeout-minutes: 20
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import json,os,shutil,subprocess,tempfile,time
          from pathlib import Path

          def run(repeat):
              directory=tempfile.mkdtemp(prefix='ckb-compaction-',dir='/dev/shm')
              command=['./compaction_service_test','--gtest_filter=CompactionServiceTest.ConcurrentCompaction']
              start=time.monotonic()
              with Path(f'evidence/{repeat}.log').open('w') as log:
                  try:
                      result=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,
                                            env={**os.environ,'TEST_TMPDIR':directory},timeout=60)
                      code=result.returncode
                  except subprocess.TimeoutExpired:
                      code=124
              if code == 0:
                  shutil.rmtree(directory)
              else:
                  shutil.move(directory, f'evidence/failed-{repeat}')
              return {'repeat':repeat,'exit_code':code,'seconds':time.monotonic()-start,
                      'command':command,'TEST_TMPDIR':directory}

          results=[]
          with ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(run,range(1,513)):
                  results.append(result)
                  Path('evidence/results.json').write_text(json.dumps(results,indent=2)+'\n')
                  if result['exit_code'] or result['repeat']%32==0:
                      print(result['repeat'],result['exit_code'],flush=True)
          assert len(results)==512 and all(result['exit_code']==0 for result in results)
          PY
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compaction-${{ matrix.revision }}
          path: evidence
          retention-days: 30
