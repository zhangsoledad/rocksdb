name: CKB native validation
on:
  push:
    branches: [codex/freezer-native-validation]
  workflow_dispatch: {}
permissions:
  contents: read
env:
  FORMAT_UPSTREAM: abeebd9630f11bd08c28b7bd43c7bdfc62050654
  API_COMPAT_REF: abeebd9630f11bd08c28b7bd43c7bdfc62050654
  CHECK_C_API_GEN_STRICT: 1
  CLANG_CXX: clang++-21
  CLANG_FORMAT_BINARY: clang-format-21
  CLANG_FORMAT_DIFF: clang-format-diff-21 -binary clang-format-21
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        status-checking: [normal, checked]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install build and validation dependencies
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y build-essential clang-21 clang-format-21 libclang-21-dev libgflags-dev libsnappy-dev liblz4-dev libzstd-dev zlib1g-dev libbz2-dev ruby python3-yaml
          clang-format-diff-21 --help
      - name: Validate source checks before compiling
        run: AUTO_CLEAN=1 make check-format check-buck-targets check-sources check-workflow-yaml check-c-api-gen
      - name: Run native checks
        env:
          STATUS_CHECKING: ${{ matrix.status-checking }}
        run: |
          set -o pipefail
          if [ "$STATUS_CHECKING" = checked ]; then
            export ASSERT_STATUS_CHECKED=1
          fi
          AUTO_CLEAN=1 make -j"$(nproc)" J="$(nproc)" DRIVER="timeout 60" check 2>&1 | tee native-check.log
      - name: Save native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.status-checking }}
          path: |
            native-check.log
            LOG
            t/**
          retention-days: 30
